[project]
name = "footage-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "ffmpeg-python",
    "static-ffmpeg",
    "opencv-python-headless",
    "wakepy",
    "scipy>=1.17.1",
    "stitching",
]

[project.scripts]
footage-studio = "footage_studio.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
