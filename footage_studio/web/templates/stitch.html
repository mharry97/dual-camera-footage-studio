{% extends "base.html" %}
{% set active = "stitch" %}

{% block content %}
<div id="message"></div>
<button class="btn-save" onclick="scan()">Scan</button>

<div id="results" style="display: none">
  <div id="sessions-container"></div>
  <button class="btn-action" id="stitch-btn" onclick="stitchSelected()">Stitch Selected</button>
</div>

<div id="progress" style="display: none">
  <p id="progress-stage"></p>
  <p id="progress-detail"></p>
  <div id="progress-warnings" style="display: none"></div>
</div>

<script>
  let _sessions = [];

  function renderFileCard(filename, label) {
    return `
      <div class="file-card">
        <div class="file-card-thumbnail"></div>
        <span class="file-card-label">${label}</span>
        <span class="file-card-name">${filename}</span>
      </div>`;
  }

  function renderSession(session, index) {
    return `
      <div class="stitch-section">
        <div class="stitch-section-header">
          <input type="checkbox" class="stitch-checkbox" id="check-${index}" checked>
          <input type="text" class="stitch-name-input" id="name-${index}" value="${session.name}">
        </div>
        <div class="file-grid">
          ${renderFileCard(session.left, 'Left Camera')}
          ${renderFileCard(session.right, 'Right Camera')}
        </div>
      </div>`;
  }

  async function scan() {
    const message = document.getElementById('message');
    const results = document.getElementById('results');
    message.textContent = '';
    results.style.display = 'none';

    const res = await fetch('/api/stitch/scan');
    const data = await res.json();

    if (data.status === 'no_directory') {
      message.textContent = 'No footage directory set. Please set one in Settings.';
      return;
    }
    if (data.status === 'directory_not_found') {
      message.textContent = 'Footage directory not found. Please check your settings.';
      return;
    }
    if (data.status === 'missing_dirs') {
      message.textContent = `Missing directories: ${data.missing.join(', ')}.`;
      return;
    }
    if (data.sessions.length === 0) {
      message.textContent = 'No sessions found. Check that both camera directories contain footage with matching timestamps.';
      return;
    }

    _sessions = data.sessions;
    const container = document.getElementById('sessions-container');
    container.innerHTML = data.sessions.map(renderSession).join('');
    results.style.display = 'block';
  }

  async function stitchSelected() {
    const selected = _sessions
      .map((s, i) => ({ ...s, name: document.getElementById(`name-${i}`).value }))
      .filter((_, i) => document.getElementById(`check-${i}`).checked);

    if (selected.length === 0) {
      document.getElementById('message').textContent = 'No sessions selected.';
      return;
    }

    document.getElementById('results').style.display = 'none';
    document.getElementById('message').textContent = '';
    document.getElementById('progress').style.display = 'block';
    document.getElementById('stitch-btn').disabled = true;

    const res = await fetch('/api/stitch/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessions: selected.map(s => ({
        name: s.name,
        left_path: s.left_path,
        right_path: s.right_path,
      })) }),
    });
    const data = await res.json();

    if (data.status !== 'ok') {
      showError('Failed to start stitching job.');
      return;
    }

    pollStatus(data.job_id);
  }

  function pollStatus(jobId) {
    const interval = setInterval(async () => {
      const res = await fetch(`/api/stitch/status/${jobId}`);
      const p = await res.json();

      if (p.warnings && p.warnings.length > 0) {
        const warnEl = document.getElementById('progress-warnings');
        warnEl.style.display = 'block';
        warnEl.innerHTML = p.warnings.map(w => `<p style="color:#a06020">${w}</p>`).join('');
      }

      if (p.stage === 'calibrating') {
        document.getElementById('progress-stage').textContent =
          `Calibrating session ${p.session_index + 1} of ${p.total_sessions}...`;
        document.getElementById('progress-detail').textContent = '';

      } else if (p.stage === 'stitching') {
        document.getElementById('progress-stage').textContent =
          `Stitching session ${p.session_index + 1} of ${p.total_sessions}...`;
        if (p.total_frames > 0) {
          const pct = Math.round((p.current_frame / p.total_frames) * 100);
          const eta = p.eta_seconds != null ? ` — ${formatEta(p.eta_seconds)} remaining` : '';
          document.getElementById('progress-detail').textContent =
            `Frame ${p.current_frame} / ${p.total_frames} (${pct}%)${eta}`;
        }

      } else if (p.stage === 'done') {
        clearInterval(interval);
        document.getElementById('progress-stage').textContent =
          `Done. ${p.total_sessions} session${p.total_sessions !== 1 ? 's' : ''} stitched.`;
        document.getElementById('progress-detail').textContent = '';

      } else if (p.stage === 'failed') {
        clearInterval(interval);
        showError(p.error || 'Stitching failed.');
      }
    }, 2000);
  }

  function formatEta(seconds) {
    if (seconds < 60) return `${seconds}s`;
    const m = Math.floor(seconds / 60), s = seconds % 60;
    return s > 0 ? `${m}m ${s}s` : `${m}m`;
  }

  function showError(msg) {
    document.getElementById('progress').style.display = 'none';
    document.getElementById('message').textContent = msg;
    document.getElementById('stitch-btn').disabled = false;
  }
</script>
{% endblock %}
