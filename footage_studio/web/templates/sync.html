{% extends "base.html" %}
{% set active = "sync" %}

{% block content %}
<div id="message"></div>
<button class="btn-save" onclick="scan()">Scan</button>

<div id="results" style="display:none">
  <div id="sessions-container"></div>
  <div class="sync-actions">
    <button class="btn-save" id="check-btn" onclick="checkAll()">Check Sync</button>
    <button class="btn-action" id="apply-btn" style="display:none" onclick="applySync()">Apply Sync</button>
  </div>
</div>

<div id="progress" style="display:none">
  <p id="progress-text"></p>
</div>

<script>
  let _sessions = [];
  let _syncData = {};  // keyed by session index: { left_offset_s, right_offset_s, duration_s, method, confidence }

  // ── Scan ──────────────────────────────────────────────────────────────────

  async function scan() {
    document.getElementById('message').textContent = '';
    document.getElementById('results').style.display = 'none';
    document.getElementById('progress').style.display = 'none';

    const res = await fetch('/api/sync/scan');
    const data = await res.json();

    if (data.status === 'no_directory') {
      document.getElementById('message').textContent = 'No footage directory set. Please set one in Settings.';
      return;
    }
    if (data.status === 'directory_not_found') {
      document.getElementById('message').textContent = 'Footage directory not found. Please check your settings.';
      return;
    }
    if (data.sessions.length === 0) {
      document.getElementById('message').textContent = 'No grouped sessions found. Run Group first.';
      return;
    }

    _sessions = data.sessions;
    _syncData = {};

    const container = document.getElementById('sessions-container');
    container.innerHTML = data.sessions.map(renderSession).join('');
    document.getElementById('apply-btn').style.display = 'none';
    document.getElementById('results').style.display = 'block';
  }

  // ── Render session card ────────────────────────────────────────────────────

  function renderSession(session, index) {
    return `
      <div class="sync-session" id="session-${index}">
        <div class="sync-session-header">
          <span class="sync-session-name">${session.name}</span>
        </div>
        <div class="sync-files">
          <span class="sync-file-label">L</span><span class="sync-file-name">${session.left}</span>
          <span class="sync-file-label">R</span><span class="sync-file-name">${session.right}</span>
        </div>
        <div class="sync-status" id="status-${index}"></div>
        <div class="sync-frame-panel" id="frame-panel-${index}" style="display:none">
          <p class="sync-frame-hint">Scrub to a recognisable moment, then adjust offset until both frames match.</p>
          <div class="sync-frames">
            <div class="sync-frame-col">
              <div class="sync-frame-label">Left</div>
              <img class="sync-frame-img" id="frame-left-${index}" src="" alt="Left frame">
            </div>
            <div class="sync-frame-col">
              <div class="sync-frame-label">Right</div>
              <img class="sync-frame-img" id="frame-right-${index}" src="" alt="Right frame">
            </div>
          </div>
          <div class="sync-sliders">
            <div class="sync-slider-row">
              <label>Preview time</label>
              <input type="range" id="time-slider-${index}" min="0" max="100" step="1" value="50"
                onchange="onTimeChange(${index})">
              <span class="sync-slider-val" id="time-val-${index}">—</span>
            </div>
            <div class="sync-slider-row">
              <label>Right offset</label>
              <input type="range" id="offset-slider-${index}" min="0" max="100" step="0.1" value="50"
                onchange="onOffsetChange(${index})">
              <span class="sync-slider-val" id="offset-val-${index}">—</span>
            </div>
          </div>
        </div>
      </div>`;
  }

  // ── Check all sessions ────────────────────────────────────────────────────

  async function checkAll() {
    document.getElementById('check-btn').disabled = true;
    document.getElementById('apply-btn').style.display = 'none';

    for (let i = 0; i < _sessions.length; i++) {
      setStatus(i, 'checking', 'Checking sync...');
    }

    await Promise.all(_sessions.map((s, i) => checkSession(s, i)));

    // Show Apply button once all checks are done
    document.getElementById('apply-btn').style.display = 'block';
    document.getElementById('check-btn').disabled = false;
  }

  async function checkSession(session, index) {
    const params = new URLSearchParams({
      left_path: session.left_path,
      right_path: session.right_path,
    });
    const res = await fetch(`/api/sync/check?${params}`);
    const data = await res.json();

    if (data.status !== 'ok') {
      setStatus(index, 'error', 'Check failed.');
      return;
    }

    _syncData[index] = {
      left_offset_s: data.left_offset_s,
      right_offset_s: data.right_offset_s,
      duration_s: data.duration_s,
      method: data.method,
      confidence: data.confidence,
    };

    if (data.accepted) {
      const conf = data.confidence != null ? ` (confidence: ${data.confidence.toFixed(3)})` : '';
      setStatus(index, 'ok', `Audio sync — offset +${data.right_offset_s.toFixed(3)}s${conf}`);
    } else {
      const confStr = data.confidence != null
        ? `confidence ${data.confidence.toFixed(3)} below threshold — `
        : '';
      setStatus(index, 'warning', `${confStr}manual alignment required`);
      showFramePanel(index, session, data);
    }
  }

  // ── Frame panel ───────────────────────────────────────────────────────────

  function showFramePanel(index, session, syncData) {
    const duration = syncData.duration_s;
    const rightOffset = syncData.right_offset_s;
    const halfRange = 10.0;

    // Configure time slider: 0→duration, default middle
    const timeSlider = document.getElementById(`time-slider-${index}`);
    timeSlider.min = 0;
    timeSlider.max = Math.floor(duration);
    timeSlider.step = 1;
    timeSlider.value = Math.floor(duration / 2);
    document.getElementById(`time-val-${index}`).textContent = formatTime(timeSlider.value);

    // Configure offset slider: rightOffset ± 10s (min may be negative)
    const offsetSlider = document.getElementById(`offset-slider-${index}`);
    const offsetMin = rightOffset - halfRange;
    const offsetMax = rightOffset + halfRange;
    offsetSlider.min = offsetMin.toFixed(1);
    offsetSlider.max = offsetMax.toFixed(1);
    offsetSlider.step = 0.1;
    offsetSlider.value = rightOffset.toFixed(1);
    document.getElementById(`offset-val-${index}`).textContent = (rightOffset >= 0 ? '+' : '') + rightOffset.toFixed(2) + 's';

    document.getElementById(`frame-panel-${index}`).style.display = 'block';
    loadFramePair(index);
  }

  function onTimeChange(index) {
    const t = document.getElementById(`time-slider-${index}`).value;
    document.getElementById(`time-val-${index}`).textContent = formatTime(t);
    loadFramePair(index);
  }

  function onOffsetChange(index) {
    const offset = parseFloat(document.getElementById(`offset-slider-${index}`).value);
    document.getElementById(`offset-val-${index}`).textContent = (offset >= 0 ? '+' : '') + offset.toFixed(2) + 's';
    // Update the stored offset so Apply uses the manual value
    _syncData[index].right_offset_s = offset;
    _syncData[index].method = 'manual';
    loadFramePair(index);
  }

  function loadFramePair(index) {
    const session = _sessions[index];
    const sync = _syncData[index];
    const sharedTime = parseFloat(document.getElementById(`time-slider-${index}`).value);

    // Left frame: shared_time after left's trim offset
    const leftTime = Math.max(0, sync.left_offset_s + sharedTime);
    // Right frame: shared_time after right's trim offset (user-adjustable; may be negative)
    const rightTime = Math.max(0, sync.right_offset_s + sharedTime);

    const leftImg = document.getElementById(`frame-left-${index}`);
    const rightImg = document.getElementById(`frame-right-${index}`);

    leftImg.src = `/api/sync/frame?video_path=${encodeURIComponent(session.left_path)}&time_s=${leftTime.toFixed(2)}`;
    rightImg.src = `/api/sync/frame?video_path=${encodeURIComponent(session.right_path)}&time_s=${rightTime.toFixed(2)}`;
  }

  // ── Apply sync ────────────────────────────────────────────────────────────

  async function applySync() {
    const sessions = _sessions.map((s, i) => {
      const sync = _syncData[i];
      return {
        name: s.name,
        left_path: s.left_path,
        right_path: s.right_path,
        left_offset_s: sync.left_offset_s,
        right_offset_s: sync.right_offset_s,
        duration_s: sync.duration_s,
        method: sync.method,
        confidence: sync.confidence,
      };
    }).filter((_, i) => _syncData[i] != null);

    if (sessions.length === 0) {
      document.getElementById('message').textContent = 'No sessions ready to sync.';
      return;
    }

    document.getElementById('results').style.display = 'none';
    document.getElementById('progress').style.display = 'block';
    document.getElementById('progress-text').textContent = 'Trimming and writing synced files...';

    const res = await fetch('/api/sync/apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessions }),
    });
    const data = await res.json();

    if (data.status !== 'ok') {
      showError('Failed to start sync job.');
      return;
    }

    pollApply(data.job_id, sessions.length);
  }

  function pollApply(jobId, total) {
    const interval = setInterval(async () => {
      const res = await fetch(`/api/sync/apply-status/${jobId}`);
      const p = await res.json();

      if (p.stage === 'running') {
        document.getElementById('progress-text').textContent =
          `Syncing session ${p.current + 1} of ${p.total}...`;
      } else if (p.stage === 'done') {
        clearInterval(interval);
        document.getElementById('progress-text').textContent =
          `Done. ${total} session${total !== 1 ? 's' : ''} synced. Proceed to Stitch.`;
      } else if (p.stage === 'failed') {
        clearInterval(interval);
        showError(p.error || 'Sync failed.');
      }
    }, 1000);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────

  function setStatus(index, type, text) {
    const el = document.getElementById(`status-${index}`);
    el.className = `sync-status sync-status-${type}`;
    el.textContent = text;
  }

  function showError(msg) {
    document.getElementById('progress').style.display = 'none';
    document.getElementById('results').style.display = 'block';
    document.getElementById('message').textContent = msg;
  }

  function formatTime(seconds) {
    const s = Math.floor(seconds);
    const m = Math.floor(s / 60);
    return m > 0 ? `${m}m ${s % 60}s` : `${s}s`;
  }
</script>
{% endblock %}
